spring.application.name=mmt-service

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/mmt_db
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update

irctc.service.url=http://localhost:8080

payment.service.url=http://localhost:8082

management.endpoints.web.exposure.include=health,info,metrics

logging.level.root=info

logging.level.com.Irctc=debug

logging.level.org.springframework=INFO

# Hibernate SQL
logging.level.org.hibernate.SQL=DEBUG

# Save logs to file
#logging.file.path=MMR-Service/logs
logging.file.name=MMR-Service/logs/application.log

# Console pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

#logback
logging.logback.rollingpolicy.file-name-pattern=MMR-Service/logs/application-%d{yyyy-MM-dd}.%i.log

logging.logback.rollingpolicy.max-file-size=7KB
logging.logback.rollingpolicy.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

